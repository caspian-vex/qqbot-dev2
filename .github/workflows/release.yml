# 构建并推送多架构镜像到 GHCR。
#
# 为什么在 CI 构建而不是在服务器上构建：
#   目标机器是 1 核 2G，本地 `docker build` 一次要几分钟，
#   期间 NapCat 还在跑，很容易把内存打爆。CI 构建 + 服务器 pull
#   把这段成本彻底移走，部署只剩几十秒的下载。
#
# 架构：linux/amd64 + linux/arm64。产物是纯 JS，两个架构的层内容几乎一致，
# 只有 node 基础镜像不同，所以构建很快。
name: release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认取短 SHA）'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本三元组
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="edge"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # 镜像名必须全小写，GitHub 的 owner 可能带大写。
          # 这里用 ${GITHUB_REPOSITORY,,}（owner/repo），所以包名就是仓库名
          # ghcr.io/caspian-vex/qqbot-dev2 —— install.sh 与 compose.yaml 的默认值
          # 必须和它一致；写成 ghcr.io/<owner>/qqbot 会指向一个不存在的包，
          # 报错是含糊的 "denied"，很难查。
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          # 不写死版本的话，跑的是 runner 自带的 node（可能还是 20），
          # 而 `node --import tsx --test "test/**/*.test.ts"` 的 glob
          # 和 engines>=22.13 都要 22+，症状是「跑测试」这一步莫名失败。
          node-version: '22'
          cache: npm

      - name: 跑测试
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: tags
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAGS="${IMAGE}:${VERSION}"
          # 主分支上的构建同时打 latest，让 install.sh 的默认值一直可用
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          # 语义化版本额外打 major.minor，方便锁大版本
          case "$VERSION" in
            *.*.*) TAGS="${TAGS},${IMAGE}:${VERSION%.*}" ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            QQBOT_VERSION=${{ steps.meta.outputs.version }}
            QQBOT_COMMIT=${{ steps.meta.outputs.commit }}
            QQBOT_BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.title=qqbot
            org.opencontainers.image.description=QQ 聊天机器人：OneBot 接入 + LLM 对话 + 自带面板
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
